<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AnimalDex</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav class="navbar navbar-dark bg-danger">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                🌿 AnimalDex
            </a>

        </div>

    </nav>

    <div class="container d-flex justify-content-center align-items-center cadastro-container">

        <div class="card shadow cadastro-card">

            <div class="card-header bg-danger text-white text-center">

                <h3 class="mb-0">Entrar</h3>

            </div>

            <div class="card-body p-4">

                <h5 class="text-center mb-4"> Bem-vindo de volta ao AnimalDex! 🐺 </h5>

                <form id="formLogin">

                    <!-- Email -->
                    <div class="mb-3">

                        <label for="emailLogin" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="emailLogin" placeholder="Digite seu e-mail" required>

                    </div>

                    <!-- Senha -->
                    <div class="mb-3">

                        <label for="senhaLogin" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="senhaLogin" placeholder="Digite sua senha" required>

                    </div>

                    <button type="submit" class="btn btn-danger w-100 mt-3"> Entrar </button>

                </form>

                <hr>

                <p class="text-center mb-0">

                    Ainda não possui uma conta?

                    <a href="cadastro.html" class="text-danger fw-bold">
                        Cadastre-se
                    </a>

                </p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
